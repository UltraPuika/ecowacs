name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "frontend/public/icon.svg", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Robots-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Robots-${{ env.VERSION_NAME }}
          path: Robots-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Robots ${{ inputs.release_tag || github.ref_name }}
          files: Robots-*.apk
          body: |
            Android lietotne robota vadībai. Instalēšana: skatiet docs/ANDROID_APP.md.
            Signed with the release key: ${{ env.HAS_SIGNING_KEY }}
